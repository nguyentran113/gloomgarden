<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GLOOMGARDEN — the garden went dark. You are its last firefly.</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #05070f;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(1200px 700px at 50% 42%, #101736 0%, #05070f 70%);
  }
  canvas {
    width: min(100vw, 177.78vh);
    height: auto;
    aspect-ratio: 16 / 9;
    display: block;
    border-radius: 6px;
    box-shadow: 0 0 90px rgba(62, 242, 200, 0.13), 0 0 34px rgba(0, 0, 0, 0.8);
    touch-action: none;
    cursor: crosshair;
  }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720"></canvas>
<script type="module" src="src/main.js"></script>
</body>
</html>
